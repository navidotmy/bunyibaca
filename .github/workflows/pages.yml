name: Build and deploy BunyiBaca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare prototype audio generator if new audio is missing
        run: |
          if [ ! -f assets/audio/word/sama.mp3 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y espeak ffmpeg
          fi
      - name: Build original reading-series offline demo audio
        run: |
          if [ ! -f assets/audio/word/sama.mp3 ]; then
            python3 tools/generate_demo_audio.py --all
          fi
      - name: Test curriculum and app
        run: npm test
      - name: Save generated prototype audio to source repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/audio audio-manifest.json audio-manifest.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'assets: generate unreviewed BunyiBaca v2 speech prototypes'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4