name: Build and deploy BunyiBaca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore app source
        shell: bash
        run: |
          set -euo pipefail
          cat deployment-payload/part-*.b64 | base64 --decode | tar -xJf -
          test -f app.mjs
          test -f curriculum.mjs
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline speech tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak ffmpeg
      - name: Generate offline demo audio
        run: python3 tools/generate_demo_audio.py --all
      - name: Run learning engine tests
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
