name: Build and deploy BunyiBaca
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore app source when initially packaged
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f app.mjs ]; then
            cat deployment-payload/part-*.b64 | base64 --decode | tar -xJf -
          fi
          test -f app.mjs
          test -f curriculum.mjs
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare offline speech tools
        run: |
          if [ ! -f assets/audio/segment/a.mp3 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y espeak ffmpeg
          fi
      - name: Generate offline demonstration audio if missing
        run: |
          if [ ! -f assets/audio/segment/a.mp3 ]; then
            python3 tools/generate_demo_audio.py --all
          fi
      - name: Run learning engine tests
        run: npm test
      - name: Save unpacked editable PWA source to main
        shell: bash
        run: |
          set -euo pipefail
          if [ -d deployment-payload ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git rm -r -q deployment-payload
            git add --all
            git commit -m 'src: publish full BunyiBaca curriculum, PWA and audio files'
            git push origin HEAD:main
          fi
      - name: Configure Pages (enable when allowed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
